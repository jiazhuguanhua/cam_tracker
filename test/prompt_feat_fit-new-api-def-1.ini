调整我的整个代码，适配下面的模式：
1. 我的yolo模型其实有两个Class Label： ball和car。你要支持他们。（在抓取区，只检测ball，car都输出0，vise versa）
2. dis相关数据不做开发 输出0即可。（我们现在使用普通摄像头）
3. 重构程序 使其更加简洁和明了 删除无用的文件
4. 现在不用开发bool in_gripper ，一直输出False即可。
5. 收到/cam_tracker/tracker_control 启动消息之后，调用ultralytics中我的模型去识别
下面是cam_tracker接口定义：
Subscribe-Publish模式
订阅：/cam_tracker/tracker_control (std_msgs/UInt8)
- 2：开始持续检测与发布(在释放区-只检测car)
- 1：开始持续检测与发布（在抓取区-只检测ball）
- 0：停止发布
发布：/cam_tracker/info (cam_tracker/CamTrack)
- 周期性发布检测结果
# CamTrack.msg

std_msgs/Header header   # 时间戳、坐标系等信息，备用。
bool system_ok           # 系统健康状态（True=正常运行，False=检测异常）

int32 ball_num #检测到的ball数量 下面的xy坐标是节点决策后最适合抓取的哪个球的坐标 所以只输出一个坐标
float32 ball_x
float32 ball_y
float32 ball_dis #到ball的距离，由d455测量，留作后续开发的接口，现在都输出0

int32 car_num #检测到的car数量 下面的
float32[] car_x
float32[] car_y
float32[] car_dis #到car的距离，由d455测量，留作后续开发的接口，现在都输出0

bool in_gripper #用于检测夹爪是否成功抓取，True为夹爪有球，False为夹爪无球

header:
  seq: 1524
  stamp:
    secs: 1731151267
    nsecs: 874563210
  frame_id: "camera_link"
system_ok: True

ball_num: 1
ball_x: 158.42
ball_y: 121.63
ball_dis: 0.00

car_num: 3
car_x: [82.37, 190.54, 255.10]
car_y: [65.80, 140.92, 188.75]
car_dis: [0.0, 0.0, 0.0]

# 第 0 辆车坐标是 (car_x[0], car_y[0])
# 以此类推

in_gripper: False


示例
🔹 示例 1：停止发布（control=0）
节点停止输出，所以 /cam_tracker/info 暂时不更新
🔹 示例 2：抓取区，只检测 ball（control=1）
header:
  seq: 105
  stamp:
    secs: 1731162345
    nsecs: 500123000
  frame_id: "camera_link"
system_ok: True

ball_num: 1
ball_x: 157.3
ball_y: 120.8
ball_dis: 0.0

car_num: 0
car_x: []
car_y: []
car_dis: []

in_gripper: False
说明：
- 只检测球，car_num=0，车相关数组为空
- ball_num=1 表示检测到一个可抓取球
- in_gripper 根据夹爪状态更新

